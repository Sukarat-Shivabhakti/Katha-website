<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete | कथा.</title>
    {% load static %}
    <link href="{% static 'src/styles.css' %}" rel="stylesheet">
</head>
<body class="bg-[#F9F6F0] dark:bg-[#121212] font-sans min-h-screen flex flex-col text-black dark:text-white transition-colors duration-300">
    
    {% include "main/components/_navbar.html" %}
    
    <div class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white dark:bg-[#1a1a1a] p-10 rounded-2xl shadow-sm w-full max-w-md border border-black/10 dark:border-white/10 transition-colors duration-300 text-center">
            
            <div class="mx-auto h-16 w-16 bg-green-50 dark:bg-green-900/20 rounded-full flex items-center justify-center mb-6 transition-colors duration-300">
                <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            
            <h2 class="text-2xl font-extrabold text-gray-900 dark:text-white transition-colors duration-300 mb-2">Password Updated!</h2>
            
            <p class="text-gray-500 dark:text-gray-400 text-sm transition-colors duration-300 mb-8 leading-relaxed">
                Your password has been set successfully. You can now log into your account using your new password.
            </p>
            
            <a href="{% url 'login' %}" class="block w-full bg-black dark:bg-white hover:bg-gray-800 dark:hover:bg-gray-200 text-white dark:text-black font-bold py-3.5 px-4 rounded-lg transition-colors duration-300 shadow-md">
                Log In Now
            </a>
            
        </div>
    </div> 

    {% include "main/components/_footer.html" %}
</body>
</html>
