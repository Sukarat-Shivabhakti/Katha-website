<nav class="bg-[#F9F6F0] border-b border-black/5 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 lg:px-8 py-4 flex justify-between items-center gap-6">
        
        <a href="{% url 'index' %}" class="text-3xl font-black text-black hover:text-gray-600 transition-colors shrink-0" style="font-family: 'Merriweather', serif;">
            कथा.
        </a>

        <div class="hidden md:flex flex-1 max-w-lg mx-auto">
            <form action="{% url 'index' %}" method="GET" class="w-full relative group">
    <!-- If they are already in a category, keep them in it while searching! -->
    {% if current_category and current_category != 'All' %}
        <input type="hidden" name="category" value="{{ current_category }}">
    {% endif %}

    <input type="text" name="q" value="{{ search_query|default:'' }}" placeholder="Search for stories, topics, or authors..." class="w-full rounded-full border-2 border-black/10 bg-white/50 px-5 py-2.5 text-sm text-black focus:border-black focus:bg-white focus:ring-0 transition-all placeholder-gray-400">
    <button type="submit" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 group-hover:text-black transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
    </button>
</form>
        </div>
        
        <div class="flex items-center space-x-6 shrink-0">
            
            <div class="hidden lg:flex items-center space-x-6 text-sm font-bold tracking-widest uppercase text-gray-500">
                <a href="{% url 'index' %}" class="hover:text-black transition-colors">Stories</a>
                <a href="{% url 'about' %}" class="hover:text-black transition-colors">About</a>
            </div>

            {% if user.is_authenticated %}
                <a href="{% url 'add_post' %}" class="hidden sm:block text-sm font-bold text-black hover:text-gray-600 transition-colors uppercase tracking-widest">
                    + Write
                </a>

                <div class="flex items-center gap-4 pl-6 border-l-2 border-black/10">
                    <a href="{% url 'profile' request.user.username %}" class="text-sm font-bold text-black hover:text-gray-600 transition-colors hidden md:block">
                        @{{ request.user.username }}
                    </a>
                    
                    <a href="{% url 'logout' %}" onclick="return confirm('Are you sure you want to logout from कथा.?');" class="bg-black text-white hover:bg-gray-800 font-bold py-2.5 px-6 text-sm rounded-full transition-colors shadow-sm">
                        Logout
                    </a>
                </div>

            {% else %}
                <div class="flex items-center gap-4 pl-6 border-l-2 border-black/10">
                    <a href="{% url 'login' %}" class="text-sm font-bold text-black hover:text-gray-600 transition-colors uppercase tracking-widest">Login</a>
                    <a href="{% url 'register' %}" class="bg-black text-white hover:bg-gray-800 font-bold py-2.5 px-6 text-sm rounded-full transition-colors shadow-sm">
                        Register
                    </a>
                </div>
            {% endif %}
        </div>
    </div>
</nav>
