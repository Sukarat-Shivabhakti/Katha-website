                    <a href="{% url 'register' %}" class="bg-black dark:bg-white text-white dark:text-black hover:bg-gray-800 dark:hover:bg-gray-200 font-bold py-2.5 px-6 text-sm rounded-full transition-colors shadow-sm">
                        Register
                    </a>

            {% endif %}
        </div>
    </div>
</nav>

<!-- Theme Toggle Script -->
<script>
    var themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
    var themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

    // Change the icons inside the button based on previous settings
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        themeToggleLightIcon.classList.remove('hidden');
        document.documentElement.classList.add('dark');
    } else {
        themeToggleDarkIcon.classList.remove('hidden');
        document.documentElement.classList.remove('dark');
    }

    var themeToggleBtn = document.getElementById('theme-toggle');

    themeToggleBtn.addEventListener('click', function() {
        // toggle icons inside button
        themeToggleDarkIcon.classList.toggle('hidden');
        themeToggleLightIcon.classList.toggle('hidden');

        // if set via local storage previously
        if (localStorage.getItem('color-theme')) {
            if (localStorage.getItem('color-theme') === 'light') {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            }
        // if NOT set via local storage previously
        } else {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        }
    });
</script>

<!-- Typewriter Animation Script -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const words = ["कथा.", "Stories."];
        let wordIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const textElement = document.getElementById("typewriter-text");

        function typeWriter() {
            const currentWord = words[wordIndex];
            
            // If deleting, remove a character. If typing, add a character.
            if (isDeleting) {
                charIndex--;
            } else {
                charIndex++;
            }

            // Update the text on screen
            textElement.textContent = currentWord.substring(0, charIndex);

            // Determine the typing speed
            let typeSpeed = isDeleting ? 80 : 150; // Deletes faster than it types

            // If word is fully typed out, pause before deleting
            if (!isDeleting && charIndex === currentWord.length) {
                typeSpeed = 2500; // Wait 2.5 seconds so people can read it
                isDeleting = true;
            } 
            // If word is fully deleted, switch to the next word and pause before typing
            else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                wordIndex = (wordIndex + 1) % words.length;
                typeSpeed = 500; // Half-second pause before starting new word
            }

            // Call the function again after the delay
            setTimeout(typeWriter, typeSpeed);
        }

        // Start the animation
        setTimeout(typeWriter, 500); // Initial delay before it starts typing
    });
</script>
